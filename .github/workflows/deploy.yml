name: Deploy to GitHub Pages

on:
  push:
    branches: [sourcecode]
  schedule:
    # Refresh data and redeploy every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      settings_enc_json_b64:
        description: 'Base64 encoded settings.enc.json generated by the Admin UI'
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Fetch static data (CVE + news feeds)
        run: npm run data:fetch
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Commit updated static data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          git diff --staged --quiet || git commit -m "chore(data): aggiorna CVE e news [skip ci]"
          git push

      - name: Write settings from Admin UI dispatch
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.settings_enc_json_b64 != '' }}
        run: npm run auth:write-dispatch
        env:
          NTH_SETTINGS_ENC_JSON_B64: ${{ github.event.inputs.settings_enc_json_b64 }}

      - name: Persist updated settings to secret (self-updating)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.settings_enc_json_b64 != '' }}
        env:
          GH_TOKEN: ${{ secrets.NTH_DEPLOY_KEY }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            gh secret set NTH_SETTINGS_ENC_JSON_B64 \
              --body "${{ github.event.inputs.settings_enc_json_b64 }}" \
              --repo ${{ github.repository }}
            echo "NTH_SETTINGS_ENC_JSON_B64 secret updated — future pushes will use updated settings."
          else
            echo "NTH_DEPLOY_KEY not configured — secret not updated. On-premise pushes may use stale settings until configured."
          fi

      - name: Write settings from secret (push / schedule)
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.settings_enc_json_b64 == '' }}
        run: npm run auth:write-dispatch
        env:
          NTH_SETTINGS_ENC_JSON_B64: ${{ secrets.NTH_SETTINGS_ENC_JSON_B64 }}

      - name: Build
        run: npm run build
        env:
          NTH_AES_TOKEN: ${{ secrets.NTH_AES_TOKEN }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
